<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#EAF6FF;--ink:#26325B;--sun:#FFC93C;--mint:#2EC4A6;--coral:#FF6B6B;--vio:#7B5CFF;--blue:#4F8DF7;--w:#fff;--r:24px}
*{box-sizing:border-box}
body{margin:0;font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;background:var(--sky) radial-gradient(circle at 10% 0,#fff8 0,#0000 40%);color:var(--ink);font-size:18px;line-height:1.4;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0}
:focus-visible{outline:4px solid var(--vio);outline-offset:3px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--w);border-bottom:4px solid var(--sun);flex-wrap:wrap}
.logo{font-weight:800;font-size:24px;background:none;display:flex;align-items:center;gap:6px}
.logo i{background:var(--vio);color:var(--sun);border-radius:12px;padding:0 8px;font-style:normal}
nav{display:flex;gap:4px}
nav button{background:none;padding:6px 12px;border-radius:99px;font-weight:700;display:flex;gap:6px;align-items:center}
nav button.on{background:var(--ink);color:var(--w)}
.right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{background:var(--sky);border-radius:99px;padding:4px 14px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.xp{width:70px;height:10px;background:var(--w);border-radius:9px;overflow:hidden}.xp i{display:block;height:100%;background:var(--mint)}
.btn{background:var(--ink);color:var(--w);padding:10px 22px;border-radius:99px;font-weight:700;box-shadow:0 4px 0 #0003;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:none}.btn.sun{background:var(--sun);color:var(--ink)}.btn.ghost{background:var(--sky);color:var(--ink)}.btn:disabled{opacity:.4}
main{max-width:1020px;margin:0 auto;padding:18px}
h2{font-size:30px;margin:8px 0}h3{margin:0}
.banner{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,var(--vio),#A58BFF 60%,#FF9FD0);color:var(--w);border-radius:32px;padding:22px 30px;overflow:hidden;position:relative}
.banner h1{font-size:clamp(26px,5vw,44px);margin:0;line-height:1.05;font-weight:800}.banner p{margin:4px 0 10px;font-size:20px}
.bh{width:190px;flex:none;margin:-6px 10px -34px auto}
.seg button,.chips button{background:#fff3;color:inherit;padding:6px 16px;border-radius:99px;font-weight:700;margin:0 6px 8px 0}
.seg button.on,.chips button.on{background:var(--ink);color:var(--w)}.chips button{background:var(--w)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cat{color:#fff;border-radius:var(--r);padding:14px;text-align:left;box-shadow:0 6px 0 #0002;transition:transform .15s}.cat:hover{transform:translateY(-4px) rotate(-1deg)}
.cat b{font-size:40px;display:block}.cat span{font-weight:800;font-size:19px}.cat .bar{margin-top:6px;background:#fff5}.cat .bar i{background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.promo{background:var(--w);border-radius:var(--r);padding:16px;text-align:left;font-weight:800;font-size:22px;box-shadow:0 6px 0 #26325B22}.promo small{display:block;font-weight:500;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin:10px 0 18px}
.card{background:var(--w);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;box-shadow:0 6px 0 #26325B26;transition:transform .15s}.card:hover{transform:translateY(-4px)}
.thumb{height:120px;display:grid;place-items:center;font-size:58px;position:relative}.thumb b{position:absolute;left:10px;top:10px;font-size:13px;padding:1px 12px;border-radius:99px}
.thumb s{position:absolute;right:10px;bottom:4px;font-size:22px;text-decoration:none}.pm{position:absolute;right:10px;top:8px;font-style:normal;font-size:22px}
.card .t{padding:8px 14px 12px}.card h3{font-size:20px}.card p{margin:0;font-size:15px;opacity:.75}.lock .thumb{filter:grayscale(.8);opacity:.7}
.chd{border-left:8px solid;padding-left:10px;margin:18px 0 4px}.chd small{opacity:.6}
.stage{position:relative;height:340px;border-radius:32px;overflow:hidden;box-shadow:inset 0 -6px 0 #0001}
.pn{height:290px}.ground{position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(#A6E884,#6FCB5A);border-top:5px solid #86D96C}
.cl{position:absolute;top:8%;left:-10%;font-size:48px;animation:drift 40s linear infinite}.cl2{top:22%;font-size:34px;animation-duration:60s;animation-delay:-25s}
.sn{position:absolute;right:5%;top:5%;font-size:52px;animation:spin 40s linear infinite}
.prop{position:absolute;font-size:44px;animation:fl 3s ease-in-out infinite}
.actor{position:absolute;bottom:28px;width:calc(var(--h)*min(21vw,150px))}
.say{background:var(--w);border-radius:var(--r);padding:14px 18px;margin-top:14px;font-size:21px;font-weight:700;display:flex;gap:12px;align-items:center;justify-content:space-between}
.tools{display:flex;gap:8px;flex:none}.tools button{background:var(--sky);width:50px;height:50px;border-radius:50%;font-size:22px}.live{background:var(--coral)!important}
.choices{display:grid;gap:12px;margin-top:14px}
.choice{color:var(--w);padding:14px 20px;border-radius:var(--r);font-size:21px;font-weight:700;text-align:left;box-shadow:0 6px 0 #0003}
.c0{background:var(--mint)}.c1{background:var(--blue)}.c2{background:var(--coral)}.choice:disabled{opacity:.55}.choice:active{transform:translateY(4px);box-shadow:none}
.panel{background:var(--w);border-radius:var(--r);padding:18px 22px;margin-top:16px}
.end{text-align:center}.big{font-size:50px}.out{font-size:21px;font-weight:700}.lesson{background:var(--sky);border-radius:var(--r);padding:12px 16px;margin:12px 0}
.reward{display:flex;justify-content:center;gap:12px;font-size:24px;font-weight:800;margin:6px 0}.reward span{background:var(--sun);border-radius:99px;padding:2px 16px}.reward .neg{background:var(--coral);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:2px dashed var(--sky);gap:10px}
.bar{height:14px;background:var(--sky);border-radius:99px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--mint)}
.note{font-size:15px;opacity:.75;margin:6px 0}.back{background:none;font-weight:700;padding:0 0 8px}.cnt{font-weight:700;margin-bottom:6px}.pg{display:flex;justify-content:space-between;margin-top:12px}
.chat{display:flex;flex-direction:column;height:min(58vh,500px)}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:82%;padding:10px 16px;border-radius:20px;background:var(--sky)}.m.me{align-self:flex-end;background:var(--vio);color:var(--w)}
.inp{display:flex;gap:8px;margin-top:10px}.inp input{flex:1;min-width:0;border:3px solid var(--sky);border-radius:99px;padding:10px 18px}
.chead{display:flex;align-items:center;gap:12px}.chead .av{width:70px}
.modal{position:fixed;inset:0;background:#26325B99;z-index:50;display:grid;place-items:center;padding:16px}
.box{background:var(--w);border-radius:32px;padding:24px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.box label,.panel label{display:block;font-weight:700;margin-top:8px}.box input,.box select,.panel input[type=text],.panel input[type=password],.panel input[type=url]{width:100%;border:3px solid var(--sky);border-radius:16px;padding:8px 14px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:14px}.plan{border:4px solid var(--sky);border-radius:var(--r);padding:16px}.plan.pro{border-color:var(--vio)}.plan ul{padding-left:20px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--w);padding:10px 22px;border-radius:99px;z-index:60;font-weight:700;max-width:90vw}
.cf{position:fixed;top:-30px;font-size:28px;animation:fall 2.2s linear forwards;z-index:70;pointer-events:none}
.fcs{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.fc{perspective:900px;height:250px;cursor:pointer}.fi{position:relative;height:100%;transition:transform .6s;transform-style:preserve-3d}.fc.on .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:14px;text-align:center;box-shadow:0 6px 0 #26325B26;display:flex;flex-direction:column;justify-content:center;gap:4px}
.ff.fr{color:#fff}.ff.fr .e{font-size:64px}.ff.bk{background:var(--w);transform:rotateY(180deg);font-size:16px;text-align:left}.ff.bk b{font-size:13px;opacity:.6}
#sheet{display:none}footer{text-align:center;font-size:14px;opacity:.7;padding:16px}
/* ===== nhân vật ===== */
svg.ch{display:block;width:100%;overflow:visible;transform-origin:50% 100%}svg.ch g{transform-box:fill-box}
.aL,.aR,.lL,.lR{transform-origin:50% 4%}.cp{transform-origin:50% 0}
.a-idle{animation:bob 2.2s ease-in-out infinite}
.a-walk .lL,.a-walk .aR{animation:sw .7s ease-in-out infinite alternate;--a:22deg}.a-walk .lR,.a-walk .aL{animation:sw .7s ease-in-out infinite alternate-reverse;--a:22deg}
.a-run{transform:rotate(8deg)}.a-run .lL,.a-run .aR{animation:sw .3s ease-in-out infinite alternate;--a:48deg}.a-run .lR,.a-run .aL{animation:sw .3s ease-in-out infinite alternate-reverse;--a:48deg}.a-run .cp{animation:flap .25s ease-in-out infinite alternate}
.a-wave .aR{animation:wv .5s ease-in-out infinite alternate}
.a-no .aR{transform:rotate(-100deg)}.a-no .aL{transform:rotate(100deg)}.a-no .hd{animation:hs .35s ease-in-out infinite alternate}
.a-cheer{animation:hop .7s ease-in-out infinite}.a-cheer .aL{transform:rotate(158deg)}.a-cheer .aR{transform:rotate(-158deg)}
.a-sad{animation:sway 2.4s ease-in-out infinite}.a-sad .hd{transform:translateY(8px) rotate(6deg)}.a-sad .aL{transform:rotate(8deg)}.a-sad .aR{transform:rotate(-8deg)}
.a-hug .aL{animation:hgL 1s ease-in-out infinite alternate}.a-hug .aR{animation:hgR 1s ease-in-out infinite alternate}.a-hug .hd{transform:rotate(6deg)}
.a-bow{animation:bw 1.3s ease-in-out infinite alternate}.a-bow .aL{transform:rotate(-35deg)}.a-bow .aR{transform:rotate(35deg)}
.a-give .aR{transform:rotate(-80deg)}.a-give .aL{transform:rotate(80deg)}.a-hold .aR{transform:rotate(-78deg)}.a-hold .aL{transform:rotate(78deg)}
.eye{animation:bl 4s infinite;transform-origin:center}
@keyframes sw{from{transform:rotate(calc(var(--a)*-1))}to{transform:rotate(var(--a))}}
@keyframes wv{from{transform:rotate(-135deg)}to{transform:rotate(-172deg)}}@keyframes hs{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hgL{from{transform:rotate(70deg)}to{transform:rotate(-38deg)}}@keyframes hgR{from{transform:rotate(-70deg)}to{transform:rotate(38deg)}}
@keyframes bw{to{transform:rotate(16deg)}}@keyframes flap{to{transform:skewX(-16deg) scaleX(.85)}}
@keyframes hop{50%{transform:translateY(-22px)}}@keyframes bob{50%{transform:translateY(-5px)}}@keyframes sway{50%{transform:translateY(5px) rotate(2deg)}}
@keyframes fl{50%{transform:translateY(-12px)}}@keyframes bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes drift{to{transform:translateX(130vw)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:760px){
 nav{position:fixed;bottom:0;left:0;right:0;background:var(--w);justify-content:space-around;padding:6px;border-top:4px solid var(--sun);z-index:30}
 nav button{flex-direction:column;gap:0;padding:4px 6px;font-size:12px;border-radius:14px}nav button b{font-size:22px}
 .bh{display:none}.stage{height:280px}.pn{height:250px}.plans,.two{grid-template-columns:1fr}.xp,.logo span{display:none}.btn{padding:8px 14px;font-size:16px}}
@media print{body>*:not(#sheet){display:none!important}#sheet{display:grid!important;grid-template-columns:repeat(3,1fr);gap:6mm;padding:8mm}
 .pc{border:2px dashed #888;border-radius:10px;padding:10px;text-align:center;break-inside:avoid;font-size:13px;color:#000}.pe{font-size:50px}}
#crumb{max-width:1020px;margin:0 auto;padding:10px 18px 0;font-size:15px}#crumb button{background:none;color:var(--vio);font-weight:700;padding:0}#crumb span{opacity:.75}
footer{background:var(--w);border-top:4px solid var(--sun);margin-top:30px;opacity:1;font-size:15px;padding:24px 16px}
.fg{max-width:1020px;margin:0 auto 14px;display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;gap:20px;text-align:left}.fg b{display:block;margin-bottom:6px;font-size:17px}.fg p{margin:0;opacity:.8}.lk{display:block;background:none;padding:2px 0;opacity:.85;text-align:left}.lk:hover{color:var(--vio)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}.st{background:var(--w);border-radius:var(--r);padding:12px 16px;box-shadow:0 5px 0 #26325B22}.st b{display:block;font-size:28px;line-height:1.1}.st small{opacity:.7}
.ql{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:6px 0 18px}.ql button{background:var(--w);border-radius:var(--r);padding:12px;font-weight:800;box-shadow:0 5px 0 #26325B22;text-align:left}.ql b{display:block;font-size:30px}
.ch2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.menu button{display:flex;gap:12px;align-items:center;width:100%;background:var(--sky);margin:6px 0;padding:12px 16px;border-radius:18px;font-weight:700;text-align:left}.menu b{font-size:24px}
.panel select,.panel textarea,.panel input[type=text]{width:100%;border:3px solid var(--sky);border-radius:16px;padding:8px 14px;margin:4px 0;font:inherit}
.pay{display:grid;grid-template-columns:290px 1fr;gap:16px}.pay img{max-width:100%;height:auto}.qrf{padding:30px;background:var(--sky);border-radius:16px}
.post{border-bottom:2px dashed var(--sky);padding:12px 0}.post .cm{background:var(--sky);border-radius:14px;padding:6px 12px;margin:6px 0 0 18px;font-size:16px}
.tg{display:inline-block;font-size:13px;border-radius:99px;padding:0 10px;background:var(--sun);font-weight:700}.stars button{background:none;font-size:34px;padding:0 2px;filter:grayscale(1);opacity:.5}.stars button.on{filter:none;opacity:1}
.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.bd2{background:var(--w);border-radius:var(--r);padding:14px;text-align:center;box-shadow:0 5px 0 #26325B22}.bd2 i{display:block;font-size:46px;font-style:normal}.bd2.off{filter:grayscale(1);opacity:.55}
.prop2{position:absolute;bottom:34px;font-size:40px;transition:all .9s;z-index:5}.prop2.lift{bottom:130px;transform:rotate(-15deg)}
.a-pick{animation:pk 1.1s ease-in-out infinite alternate}.a-pick .aL{animation:pL .55s ease-in-out infinite alternate}.a-pick .aR{animation:pR .55s ease-in-out infinite alternate}.a-pick .hd{transform:translateY(12px)}
@keyframes pk{to{transform:rotate(24deg) translate(10px,8px)}}@keyframes pL{from{transform:rotate(15deg)}to{transform:rotate(-55deg)}}@keyframes pR{from{transform:rotate(-15deg)}to{transform:rotate(55deg)}}
@media(max-width:760px){.fg{grid-template-columns:1fr 1fr}.pay{grid-template-columns:1fr}}
.un{display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.acc{display:flex;gap:12px;align-items:center;margin-bottom:10px}.av2{width:56px;height:56px;border-radius:50%;background:var(--vio);color:#fff;font-size:26px;font-weight:800;display:grid;place-items:center;flex:none}.row2{display:flex;gap:8px;margin:6px 0}
.pbs{position:relative;margin-bottom:14px}.pb{display:none;align-items:center;gap:16px;border-radius:32px;padding:20px 26px;color:#fff;animation:pop .4s}.pb.on{display:flex}.pb h3{font-size:24px}.pb p{margin:2px 0 10px}.pe2{font-size:64px}.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:10px;height:10px;border-radius:50%;background:#26325B33}.dots i.on{background:var(--vio);width:26px;border-radius:9px}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.about{margin-top:20px}.ab{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:8px 0 14px}.ab .st b{font-size:34px}.ab .st h3{font-size:19px}.adm{text-align:center;margin:20px 0 0}
.spin{width:70px;height:70px;border:8px solid var(--sky);border-top-color:var(--vio);border-radius:50%;margin:10px auto;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.lb{max-height:420px;overflow:auto}
/* bối cảnh */
.th{position:absolute;inset:0;overflow:hidden}.flr{position:absolute;left:0;right:0;bottom:0;height:62px}.sc{position:absolute;line-height:1}
.board{position:absolute;left:8%;top:10%;width:34%;height:34%;background:#2F5D50;border:6px solid #A87B4F;border-radius:8px;color:#fff;font-weight:800;display:grid;place-items:center}
.desk{position:absolute;bottom:40px;width:26%;height:46px;background:#C98F5A;border-radius:8px 8px 0 0;box-shadow:0 38px 0 -28px #8C5A33}
.water{position:absolute;left:40%;right:0;bottom:0;height:46%;z-index:7;background:linear-gradient(rgba(70,170,240,.55),rgba(30,120,210,.78));animation:wv2 2s ease-in-out infinite alternate}@keyframes wv2{to{transform:translateY(6px)}}
.road{position:absolute;left:0;right:0;bottom:0;height:70px;background:#5D6475;border-top:6px solid #C9CEDA}.road:after{content:"";position:absolute;left:30%;width:36%;top:0;bottom:0;background:repeating-linear-gradient(90deg,#fff 0 14px,transparent 14px 30px)}
.car{position:absolute;bottom:14px;font-size:50px;animation:drv 7s linear infinite}@keyframes drv{from{left:-15%}to{left:110%}}
.rain{position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 10px,rgba(255,255,255,.5) 10px 11px);background-size:60px 60px;animation:rn .5s linear infinite}@keyframes rn{to{background-position:-20px 60px}}
/* tư thế mới + chuyển động mượt */
.aL,.aR,.lL,.lR,.hd,.cp{transition:transform .3s ease}
.a-flail{animation:fb .5s ease-in-out infinite alternate}.a-flail .aL{animation:fa1 .3s ease-in-out infinite alternate}.a-flail .aR{animation:fa2 .3s ease-in-out infinite alternate}
@keyframes fb{to{transform:translateY(-8px)}}@keyframes fa1{from{transform:rotate(130deg)}to{transform:rotate(170deg)}}@keyframes fa2{from{transform:rotate(-170deg)}to{transform:rotate(-130deg)}}
.a-point .aR{transform:rotate(-105deg)}.a-point .aL{transform:rotate(8deg)}
/* ===== bộ thẻ (đã sửa lệch khung, QR + logo nằm trong thẻ, mặt sau là bầu trời) ===== */
.fcs{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.fc{height:300px}
.ff{padding:0;display:block;overflow:hidden;text-align:left;font-family:'Baloo 2','Trebuchet MS',sans-serif;line-height:1.25}
.ff.fr{color:#fff}.ff.fr .e{font-size:64px}
.lg2{position:absolute;top:9px;left:9px;display:flex;align-items:center;gap:4px;font-weight:800;font-size:12px;background:#fff;color:#26325B;border-radius:99px;padding:2px 10px 2px 4px;max-width:calc(100% - 18px);white-space:nowrap;z-index:2}
.lg2 i{font-style:normal;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#7B5CFF,#FF7AC6);display:grid;place-items:center;font-size:12px}
.fr .art{position:absolute;top:38px;left:9px;right:9px;height:130px;border-radius:14px;overflow:hidden}
.fr .ae{position:absolute;left:8px;top:4px;font-size:40px;line-height:1}.fr .ach{position:absolute;right:6px;bottom:-4px;width:78px}.fr .ach svg{width:100%;height:auto}
.fr .tx{position:absolute;left:12px;right:82px;bottom:12px}.fr .tx h3{margin:0;font-size:18px;line-height:1.1;overflow-wrap:anywhere}.fr .tx small{display:block;opacity:.9;font-size:13px;margin-top:2px}
.qr{position:absolute;right:9px;bottom:9px;width:64px;height:64px;background:#fff;border-radius:9px;padding:3px;box-shadow:0 2px 0 #0002}
.ff.bk{background:linear-gradient(#6EC3FF 0,#BFE6FF 55%,#F2FAFF 100%);color:#26325B}
.ff.bk:before{content:"☁️";position:absolute;right:12px;top:34px;font-size:34px;opacity:.9;animation:drift 8s ease-in-out infinite alternate}
.ff.bk:after{content:"☁️";position:absolute;left:10px;bottom:84px;font-size:26px;opacity:.7;animation:drift 10s ease-in-out infinite alternate-reverse}
.bk .tx2{position:absolute;top:40px;left:12px;right:12px;bottom:80px;overflow:hidden;font-size:14px}.bk .tx2 b{display:block;font-size:12px;opacity:.75;margin-top:4px}.bk .tx2 p{margin:0 0 4px}
.bk .cd{position:absolute;left:12px;bottom:12px;right:84px;font-size:12px;font-weight:700;opacity:.8}
@keyframes drift{to{transform:translateX(18px)}}

const LINE=(v,c)=>{const m=Math.max(1,...v),P=v.map((x,i)=>`${20+i*43},${105-x/m*85}`);return `<svg viewBox="0 0 300 130" style="width:100%"><polyline points="${P.join(' ')}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${P.map((p,i)=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="5" fill="${c}"/><text x="${p.split(',')[0]}" y="${+p.split(',')[1]-10}" font-size="11" text-anchor="middle" fill="#26325B">${v[i]}</text>`).join('')}</svg>`};

const rng=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}};
const T100={};
function top100(key){if(T100[key])return T100[key];const r=rng(key),k0=key.split(':')[0],L=[];let rp={nation:1800,duel:1100}[k0]||800;
 for(let i=0;i<100;i++){rp-=Math.round(({nation:1800,duel:1100}[k0]||800)/115*(.5+r()));L.push({n:HO[Math.floor(r()*10)]+' '+DM[Math.floor(r()*10)]+' '+TN[Math.floor(r()*14)],rp:Math.max(0,rp),r:k0==='region'?key.split(':')[1]:PROV[Math.floor(r()*5)]})}return T100[key]=L}
function rankOf(key,rp){const L=top100(key),i=L.findIndex(p=>rp>=p.rp);if(i>=0)return i+1;const last=Math.max(1,L[99].rp);return 101+Math.round((last-rp)/last*(TOTAL-101))}

  </div>
  <div class="book-controls"><button class="btn ghost" id="bookPrevText" ${start===0?'disabled':''}>◀ Trang trước</button><span class="book-dots" aria-label="Tiến độ">${c.pn.map((_,index)=>`<i class="${index>=start&&index<=end?'on':''}"></i>`).join('')}</span>
   ${last?`<button class="btn sun" id="bookLesson">🎮 Chơi bài: ${esc(lesson?lesson.t:'Bài học')}</button>`:'<button class="btn" id="bookNextText">Trang tiếp ▶</button>}
   <button class="btn ghost" id="bookRead" aria-label="Đọc trang này">🔊 Đọc truyện</button></div>
  <p class="book-note">Lật từng trang để theo dõi câu chuyện của Hero.</p>
 </section>`;
 $('#bookBack').onclick=()=>go('comic');
 const nextButton=$('#bookNext'),prevButton=$('#bookPrev'),nextText=$('#bookNextText'),prevText=$('#bookPrevText');
 const turn=direction=>{
  const target=direction==='next'?start+2:start-2;
  if(target<0||target>=c.pn.length||app.querySelector('.book-flip-sheet.anim-next,.book-flip-sheet.anim-prev'))return;
  Voice.stop();
  const destination=Math.min(target,c.pn.length-1);
  const previewIndex=direction==='next'?Math.min(start+1,c.pn.length-1):start;
  const temporary=document.createElement('div');
  temporary.innerHTML=`<div class="book-flip-sheet ${direction}"><div class="book-flip-face front">${storyArt(c,previewIndex)}</div><div class="book-flip-face back">${storyArt(c,destination)}</div></div>`;
  const sheet=temporary.firstElementChild;
  $('#bookSpread').append(sheet);
  const finish=()=>renderStoryBook(c,destination);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return}
  requestAnimationFrame(()=>sheet.classList.add(direction==='next'?'anim-next':'anim-prev'));
  sheet.addEventListener('animationend',finish,{once:true});
  setTimeout(()=>{if(sheet.isConnected)finish()},850);
 };
 if(start>0){prevButton.onclick=()=>turn('prev');prevText.onclick=()=>turn('prev')}
 if(!last){nextButton.onclick=()=>turn('next');nextText.onclick=()=>turn('next')}
 if(last&&lesson)$('#bookLesson').onclick=()=>locked(lesson)?plans():play(lesson);
 $('#bookRead').onclick=()=>Voice.speak(c.pn.slice(start,end+1).map(page=>page[2]).join(' '));
 if(!flip)setTimeout(()=>Voice.speak(c.pn.slice(start,end+1).map(page=>page[2]).join(' ')),350);
}
readC=function(c,index){
 if(!c)return go('comic');
 if(c.p&&S.plan!=='premium'){plans();return}
 view='comic';Voice.stop();shell();renderStoryBook(c,Math.max(0,Math.min(c.pn.length-1,Math.floor(index/2)*2)));
};
afterGo=function(v){
 document.body.dataset.v=v;
 const page=PH[v];
 document.body.style.background=page?page[4]:'';
 if(page)app.insertAdjacentHTML('afterbegin',`<section class="lh-page-intro"><div><h1>${page[1]}</h1><p>${page[2]}</p></div><span class="lh-page-orbit" aria-hidden="true"></span></section>`);
};
boom=function(){
 const colors=['#ffc93c','#ff8fa3','#2ec4a6','#7b5cff'];
 for(let i=0;i<24;i++){
  const piece=document.createElement('span');piece.className='cf';piece.style.left=Math.random()*100+'vw';
  piece.style.backgroundColor=colors[i%colors.length];piece.style.animationDelay=(Math.random()*.7)+'s';
  document.body.append(piece);setTimeout(()=>piece.remove(),3000);
 }
};
const _playObjects=play;
play=function(lesson,scene,ex){
 _playObjects(lesson,scene,ex);
 $$('.stage .cl').forEach(cloud=>{cloud.textContent='';cloud.insertAdjacentHTML('afterbegin',storyObject('cloud'))});
 const sun=$('.stage .sn');if(sun){sun.textContent='';sun.insertAdjacentHTML('afterbegin',storyObject('sun'))}
 const prop=$('#pp');
 if(prop){
  const label=prop.textContent;
  const kind=label.includes('🚦')||label.includes('🔴')?'traffic':label.includes('🚗')?'car':label.includes('🏫')?'school':label.includes('🚰')?'faucet':label.includes('🧼')?'soap':label.includes('🫧')?'bubbles':label.includes('🍚')?'bowl':label.includes('🍽')?'plate':label.includes('🌧')?'rain':label.includes('☔')?'umbrella':label.includes('📦')?'box':label.includes('📚')?'book':label.includes('🧱')?'blocks':'star';
  prop.textContent='';prop.insertAdjacentHTML('afterbegin',storyObject(kind));
 }
};
go('home');deep();
go('home');deep();
</script>
</body>
</html>
