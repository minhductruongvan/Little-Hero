<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Hero – Kỹ năng sống cho bé</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#EAF6FF;--ink:#26325B;--sun:#FFC93C;--mint:#2EC4A6;--coral:#FF6B6B;--vio:#7B5CFF;--blue:#4F8DF7;--w:#fff;--r:24px}
*{box-sizing:border-box}
body{margin:0;font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;background:var(--sky) radial-gradient(circle at 10% 0,#fff8 0,#0000 40%);color:var(--ink);font-size:18px;line-height:1.4;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0}
:focus-visible{outline:4px solid var(--vio);outline-offset:3px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--w);border-bottom:4px solid var(--sun);flex-wrap:wrap}
.logo{font-weight:800;font-size:24px;background:none;display:flex;align-items:center;gap:6px}
.logo i{background:var(--vio);color:var(--sun);border-radius:12px;padding:0 8px;font-style:normal}
nav{display:flex;gap:4px}
nav button{background:none;padding:6px 12px;border-radius:99px;font-weight:700;display:flex;gap:6px;align-items:center}
nav button.on{background:var(--ink);color:var(--w)}
.right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{background:var(--sky);border-radius:99px;padding:4px 14px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.xp{width:70px;height:10px;background:var(--w);border-radius:9px;overflow:hidden}.xp i{display:block;height:100%;background:var(--mint)}
.btn{background:var(--ink);color:var(--w);padding:10px 22px;border-radius:99px;font-weight:700;box-shadow:0 4px 0 #0003;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:none}.btn.sun{background:var(--sun);color:var(--ink)}.btn.ghost{background:var(--sky);color:var(--ink)}.btn:disabled{opacity:.4}
main{max-width:1020px;margin:0 auto;padding:18px}
h2{font-size:30px;margin:8px 0}h3{margin:0}
.banner{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,var(--vio),#A58BFF 60%,#FF9FD0);color:var(--w);border-radius:32px;padding:22px 30px;overflow:hidden;position:relative}
.banner h1{font-size:clamp(26px,5vw,44px);margin:0;line-height:1.05;font-weight:800}.banner p{margin:4px 0 10px;font-size:20px}
.bh{width:190px;flex:none;margin:-6px 10px -34px auto}
.seg button,.chips button{background:#fff3;color:inherit;padding:6px 16px;border-radius:99px;font-weight:700;margin:0 6px 8px 0}
.seg button.on,.chips button.on{background:var(--ink);color:var(--w)}.chips button{background:var(--w)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cat{color:#fff;border-radius:var(--r);padding:14px;text-align:left;box-shadow:0 6px 0 #0002;transition:transform .15s}.cat:hover{transform:translateY(-4px) rotate(-1deg)}
.cat b{font-size:40px;display:block}.cat span{font-weight:800;font-size:19px}.cat .bar{margin-top:6px;background:#fff5}.cat .bar i{background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.promo{background:var(--w);border-radius:var(--r);padding:16px;text-align:left;font-weight:800;font-size:22px;box-shadow:0 6px 0 #26325B22}.promo small{display:block;font-weight:500;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin:10px 0 18px}
.card{background:var(--w);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;box-shadow:0 6px 0 #26325B26;transition:transform .15s}.card:hover{transform:translateY(-4px)}
.thumb{height:120px;display:grid;place-items:center;font-size:58px;position:relative}.thumb b{position:absolute;left:10px;top:10px;font-size:13px;padding:1px 12px;border-radius:99px}
.thumb s{position:absolute;right:10px;bottom:4px;font-size:22px;text-decoration:none}.pm{position:absolute;right:10px;top:8px;font-style:normal;font-size:22px}
.card .t{padding:8px 14px 12px}.card h3{font-size:20px}.card p{margin:0;font-size:15px;opacity:.75}.lock .thumb{filter:grayscale(.8);opacity:.7}
.chd{border-left:8px solid;padding-left:10px;margin:18px 0 4px}.chd small{opacity:.6}
.stage{position:relative;height:340px;border-radius:32px;overflow:hidden;box-shadow:inset 0 -6px 0 #0001}
.pn{height:290px}.ground{position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(#A6E884,#6FCB5A);border-top:5px solid #86D96C}
.cl{position:absolute;top:8%;left:-10%;font-size:48px;animation:drift 40s linear infinite}.cl2{top:22%;font-size:34px;animation-duration:60s;animation-delay:-25s}
.sn{position:absolute;right:5%;top:5%;font-size:52px;animation:spin 40s linear infinite}
.prop{position:absolute;font-size:44px;animation:fl 3s ease-in-out infinite}
.actor{position:absolute;bottom:28px;width:calc(var(--h)*min(21vw,150px))}
.say{background:var(--w);border-radius:var(--r);padding:14px 18px;margin-top:14px;font-size:21px;font-weight:700;display:flex;gap:12px;align-items:center;justify-content:space-between}
.tools{display:flex;gap:8px;flex:none}.tools button{background:var(--sky);width:50px;height:50px;border-radius:50%;font-size:22px}.live{background:var(--coral)!important}
.choices{display:grid;gap:12px;margin-top:14px}
.choice{color:var(--w);padding:14px 20px;border-radius:var(--r);font-size:21px;font-weight:700;text-align:left;box-shadow:0 6px 0 #0003}
.c0{background:var(--mint)}.c1{background:var(--blue)}.c2{background:var(--coral)}.choice:disabled{opacity:.55}.choice:active{transform:translateY(4px);box-shadow:none}
.panel{background:var(--w);border-radius:var(--r);padding:18px 22px;margin-top:16px}
.end{text-align:center}.big{font-size:50px}.out{font-size:21px;font-weight:700}.lesson{background:var(--sky);border-radius:var(--r);padding:12px 16px;margin:12px 0}
.reward{display:flex;justify-content:center;gap:12px;font-size:24px;font-weight:800;margin:6px 0}.reward span{background:var(--sun);border-radius:99px;padding:2px 16px}.reward .neg{background:var(--coral);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:2px dashed var(--sky);gap:10px}
.bar{height:14px;background:var(--sky);border-radius:99px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--mint)}
.note{font-size:15px;opacity:.75;margin:6px 0}.back{background:none;font-weight:700;padding:0 0 8px}.cnt{font-weight:700;margin-bottom:6px}.pg{display:flex;justify-content:space-between;margin-top:12px}
.chat{display:flex;flex-direction:column;height:min(58vh,500px)}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:82%;padding:10px 16px;border-radius:20px;background:var(--sky)}.m.me{align-self:flex-end;background:var(--vio);color:var(--w)}
.inp{display:flex;gap:8px;margin-top:10px}.inp input{flex:1;min-width:0;border:3px solid var(--sky);border-radius:99px;padding:10px 18px}
.chead{display:flex;align-items:center;gap:12px}.chead .av{width:70px}
.modal{position:fixed;inset:0;background:#26325B99;z-index:50;display:grid;place-items:center;padding:16px}
.box{background:var(--w);border-radius:32px;padding:24px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.box label,.panel label{display:block;font-weight:700;margin-top:8px}.box input,.box select,.panel input[type=text],.panel input[type=password],.panel input[type=url]{width:100%;border:3px solid var(--sky);border-radius:16px;padding:8px 14px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:14px}.plan{border:4px solid var(--sky);border-radius:var(--r);padding:16px}.plan.pro{border-color:var(--vio)}.plan ul{padding-left:20px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--w);padding:10px 22px;border-radius:99px;z-index:60;font-weight:700;max-width:90vw}
.cf{position:fixed;top:-30px;font-size:28px;animation:fall 2.2s linear forwards;z-index:70;pointer-events:none}
.fcs{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.fc{perspective:900px;height:250px;cursor:pointer}.fi{position:relative;height:100%;transition:transform .6s;transform-style:preserve-3d}.fc.on .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:14px;text-align:center;box-shadow:0 6px 0 #26325B26;display:flex;flex-direction:column;justify-content:center;gap:4px}
.ff.fr{color:#fff}.ff.fr .e{font-size:64px}.ff.bk{background:var(--w);transform:rotateY(180deg);font-size:16px;text-align:left}.ff.bk b{font-size:13px;opacity:.6}
#sheet{display:none}footer{text-align:center;font-size:14px;opacity:.7;padding:16px}
/* ===== nhân vật ===== */
svg.ch{display:block;width:100%;overflow:visible;transform-origin:50% 100%}svg.ch g{transform-box:fill-box}
.aL,.aR,.lL,.lR{transform-origin:50% 4%}.cp{transform-origin:50% 0}
.a-idle{animation:bob 2.2s ease-in-out infinite}
.a-walk .lL,.a-walk .aR{animation:sw .7s ease-in-out infinite alternate;--a:22deg}.a-walk .lR,.a-walk .aL{animation:sw .7s ease-in-out infinite alternate-reverse;--a:22deg}
.a-run{transform:rotate(8deg)}.a-run .lL,.a-run .aR{animation:sw .3s ease-in-out infinite alternate;--a:48deg}.a-run .lR,.a-run .aL{animation:sw .3s ease-in-out infinite alternate-reverse;--a:48deg}.a-run .cp{animation:flap .25s ease-in-out infinite alternate}
.a-wave .aR{animation:wv .5s ease-in-out infinite alternate}
.a-no .aR{transform:rotate(-100deg)}.a-no .aL{transform:rotate(100deg)}.a-no .hd{animation:hs .35s ease-in-out infinite alternate}
.a-cheer{animation:hop .7s ease-in-out infinite}.a-cheer .aL{transform:rotate(158deg)}.a-cheer .aR{transform:rotate(-158deg)}
.a-sad{animation:sway 2.4s ease-in-out infinite}.a-sad .hd{transform:translateY(8px) rotate(6deg)}.a-sad .aL{transform:rotate(8deg)}.a-sad .aR{transform:rotate(-8deg)}
.a-hug .aL{animation:hgL 1s ease-in-out infinite alternate}.a-hug .aR{animation:hgR 1s ease-in-out infinite alternate}.a-hug .hd{transform:rotate(6deg)}
.a-bow{animation:bw 1.3s ease-in-out infinite alternate}.a-bow .aL{transform:rotate(-35deg)}.a-bow .aR{transform:rotate(35deg)}
.a-give .aR{transform:rotate(-80deg)}.a-give .aL{transform:rotate(80deg)}.a-hold .aR{transform:rotate(-78deg)}.a-hold .aL{transform:rotate(78deg)}
.eye{animation:bl 4s infinite;transform-origin:center}
@keyframes sw{from{transform:rotate(calc(var(--a)*-1))}to{transform:rotate(var(--a))}}
@keyframes wv{from{transform:rotate(-135deg)}to{transform:rotate(-172deg)}}@keyframes hs{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hgL{from{transform:rotate(70deg)}to{transform:rotate(-38deg)}}@keyframes hgR{from{transform:rotate(-70deg)}to{transform:rotate(38deg)}}
@keyframes bw{to{transform:rotate(16deg)}}@keyframes flap{to{transform:skewX(-16deg) scaleX(.85)}}
@keyframes hop{50%{transform:translateY(-22px)}}@keyframes bob{50%{transform:translateY(-5px)}}@keyframes sway{50%{transform:translateY(5px) rotate(2deg)}}
@keyframes fl{50%{transform:translateY(-12px)}}@keyframes bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes drift{to{transform:translateX(130vw)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:760px){
 nav{position:fixed;bottom:0;left:0;right:0;background:var(--w);justify-content:space-around;padding:6px;border-top:4px solid var(--sun);z-index:30}
 nav button{flex-direction:column;gap:0;padding:4px 6px;font-size:12px;border-radius:14px}nav button b{font-size:22px}
 .bh{display:none}.stage{height:280px}.pn{height:250px}.plans,.two{grid-template-columns:1fr}.xp,.logo span{display:none}.btn{padding:8px 14px;font-size:16px}}
@media print{body>*:not(#sheet){display:none!important}#sheet{display:grid!important;grid-template-columns:repeat(3,1fr);gap:6mm;padding:8mm}
 .pc{border:2px dashed #888;border-radius:10px;padding:10px;text-align:center;break-inside:avoid;font-size:13px;color:#000}.pe{font-size:50px}}
</style>

const Voice={on:true,chatMode:false,tok:0,cb:null,
 speak(t,done){const k=++this.tok,fin=()=>{if(k===this.tok&&done)done()};
  if(!this.on||!('speechSynthesis' in window)){setTimeout(fin,800);return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=S.set.rate;u.pitch=S.set.pitch;
  const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('vi'));if(v)u.voice=v;
  u.onstart=()=>this.cb&&this.cb(1);u.onend=u.onerror=()=>{this.cb&&this.cb(0);fin()};speechSynthesis.speak(u)},
 listen(onText,btn){const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){toast('Hãy dùng Chrome hoặc Edge để nói chuyện bằng giọng nói');return}
  const r=new R();r.lang='vi-VN';btn&&btn.classList.add('live');
  r.onresult=e=>onText(e.results[0][0].transcript);r.onend=()=>btn&&btn.classList.remove('live');r.onerror=()=>{this.chatMode=false};r.start()},
 stop(){this.tok++;this.chatMode=false;this.cb=null;'speechSynthesis' in window&&speechSynthesis.cancel()}};

/* ============ CHƠI BÀI: các nhân vật tương tác thật ============ */
const parseCast=s=>s.split(',').map(x=>{const[a,b,c]=x.split(':');return{k:a,x:+b,m:c||'happy'}});
const actorH=(k,x,m)=>`<div class="actor" id="a-${k}" data-m="${m}" style="left:${x}%;--h:${k==='me'?1:CAST[k].h};z-index:${k==='me'?6:3}">${char(k,m==='sad'?'sad':'idle',m)}</div>`;
function pose(k,p,m){const a=$('#a-'+k);if(!a)return;m=m||a.dataset.m;a.dataset.m=m;a.innerHTML=char(k,p,m)}
function award(id,ok){const p=S.prog[id]||(S.prog[id]={plays:0,ok:0}),b=S.xp,bl=lv();p.plays++;
 if(ok){S.xp+=p.ok?5:20;p.ok++}else S.xp=Math.max((bl-1)*100,S.xp-10);save();return{d:S.xp-b,up:lv()>bl}}
function play(l){view='play';Voice.stop();shell();const c=cat(l.c),cs=parseCast(l.cast),ord=[0,1,2].sort(()=>Math.random()-.5);
 app.innerHTML=`<button class="back" id="bk">← ${c.n}</button>
 <div class="stage" id="stg" style="background:${c.bg}"><span class="cl">☁️</span><span class="cl cl2">☁️</span><span class="sn">☀️</span><div class="ground"></div>${actorH('me',6,'happy')}${cs.map(x=>actorH(x.k,x.x,x.m)).join('')}</div>
 <div class="say"><span>${l.q}</span><span class="tools"><button id="again" aria-label="Nghe lại">🔊</button><button id="mic" aria-label="Nói để chọn">🎤</button></span></div>
 <div class="choices">${ord.map((i,n)=>`<button class="choice c${n}" data-i="${i}">${'ABC'[n]}. ${l.o[i][0]}</button>`).join('')}</div><div id="res"></div>`;
 $('#bk').onclick=()=>{S.catSel=l.c;go('learn')};
 const read=()=>Voice.speak(l.q+' '+ord.map((i,n)=>'Lựa chọn '+'ABC'[n]+'. '+l.o[i][0]).join('. '));$('#again').onclick=read;setTimeout(read,300);
 const choose=i=>{const o=l.o[i];$$('.choice').forEach(b=>b.disabled=true);Voice.stop();const st=$('#stg'),run=o[6]===1,dur=run?900:1400,me=$('#a-me');let moved=0;
  if(o[1]){let x;if(o[1]==='>')x=100;else if(o[1]==='<')x=-30;else{const t=$('#a-'+o[1]).getBoundingClientRect(),s=st.getBoundingClientRect(),h=me.getBoundingClientRect();x=((t.left-s.left)-h.width*.55)/s.width*100}
   pose('me',run?'run':'walk');me.style.transition=`left ${dur}ms linear`;me.style.left=x+'%';moved=dur+100}
  setTimeout(()=>{if(!$('#stg'))return;pose('me',o[2],o[4]?'happy':'sad');
   (o[1]&&o[1].length>1?[o[1]]:cs.map(x=>x.k)).forEach(k=>pose(k,o[3],o[4]?'happy':'sad'));
   setTimeout(()=>{if($('#stg'))showRes(l,o)},1700)},moved||150)};
 $$('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
 $('#mic').onclick=e=>{Voice.stop();Voice.listen(said=>{said=said.toLowerCase();const w=said.split(/\s+/);let best=-1,sc=0;
  ord.forEach((i,n)=>{let s=l.o[i][0].toLowerCase().split(/\s+/).filter(x=>x.length>2&&said.includes(x)).length;
   if(w.some(x=>[['a','một','1'],['b','hai','2'],['c','ba','3']][n].includes(x)))s+=3;if(s>sc){sc=s;best=i}});
  best>=0?choose(best):Voice.speak('Hero chưa nghe rõ, bé nói lại nhé')},e.currentTarget)}}
function showRes(l,o){const ok=o[4],r=award(l.id,ok),all=LESSONS.filter(x=>!locked(x)),nx=all[all.indexOf(l)+1];
 $('#res').innerHTML=`<div class="panel end"><div class="big">${ok?'🌟':'💭'}</div><h2>${ok?'Chọn đúng rồi!':'Chưa đúng rồi!'}</h2><p class="out">${o[5]}</p>
 <div class="reward"><span class="${r.d<0?'neg':''}">${r.d>0?'+':''}${r.d} điểm</span><span>Lv ${lv()}</span></div>
 ${r.up?`<p><b>🎉 Lên cấp ${lv()}! Bé là ${title()}</b></p>`:''}${!ok&&r.d===0?'<p class="note">Bé đang ở đầu cấp nên không bị tụt cấp.</p>':''}
 <div class="lesson">💡 ${l.l}</div><button class="btn" id="rt">${ok?'Chơi lại':'Thử lại'}</button> ${nx?'<button class="btn sun" id="nx">Bài tiếp theo ▶</button>':''} <button class="btn ghost" id="lb">Về bài học</button></div>`;
 $('#res').scrollIntoView({behavior:'smooth'});shell();if(r.up)boom();
 $('#rt').onclick=()=>play(l);if(nx)$('#nx').onclick=()=>play(nx);$('#lb').onclick=()=>{S.catSel=l.c;go('learn')};
 Voice.speak((ok?'Giỏi lắm! ':'Chưa đúng rồi. ')+o[5]+' '+l.l)}

 ${cs.map(c=>`<div class="actor" style="left:${c.x}%;--h:${c.k==='me'?1:CAST[c.k].h};z-index:${c.k==='me'?6:3}">${char(c.k,c.po,c.m)}</div>`).join('')}</div>`}

 <div class="say"><span>${p[2]}</span><span class="tools"><button id="rd" aria-label="Đọc">🔊</button></span></div>
 <div class="pg"><button class="btn ghost" id="pv" ${i?'':'disabled'}>◀ Trước</button>${last?`<button class="btn sun" id="ls">🎮 Chơi bài: ${l.t}</button>`:'<button class="btn" id="nx">Tiếp ▶</button>'}</div>`;
 $('#bk').onclick=()=>go('comic');$('#rd').onclick=()=>Voice.speak(p[2]);setTimeout(()=>Voice.speak(p[2]),300);
 if(i)$('#pv').onclick=()=>readC(c,i-1);if(last)$('#ls').onclick=()=>locked(l)?plans():play(l);else $('#nx').onclick=()=>readC(c,i+1)}

/* ============ BỘ THẺ ============ */
const code=l=>'HERO-'+l.id.toUpperCase(),good=l=>l.o.find(o=>o[4])[0],bad=l=>l.o.find(o=>!o[4])[0];
function fc(l){const c=cat(l.c);if(locked(l))return `<div class="fc" data-lock="1"><div class="fi"><div class="ff fr" style="background:#B8C0D6"><div class="e">🔒</div><h3>${l.t}</h3><small>Thẻ Premium</small></div></div></div>`;
 return `<div class="fc"><div class="fi"><div class="ff fr" style="background:${c.c}"><div class="e">${l.e}</div><h3>${l.t}</h3><small>${c.n}</small></div>
 <div class="ff bk"><b>✅ NÊN LÀM</b>${good(l)}<b>❌ KHÔNG NÊN</b>${bad(l)}<b>MÃ THẺ: ${code(l)}</b></div></div></div>`}
function cardsV(){app.innerHTML=`<h2>Bộ thẻ kỹ năng sống</h2><p class="note">Chạm vào thẻ để lật. In bộ thẻ ra giấy để bé học cùng bố mẹ, rồi nhập mã trên thẻ để vào đúng bài học trong app.</p>
 <div class="panel"><div class="inp"><input id="cd" placeholder="Nhập mã trên thẻ, ví dụ HERO-TAY"><button class="btn" id="cg">Mở bài</button><button class="btn sun" id="pr">🖨️ In bộ thẻ</button></div><p id="ce" class="note"></p></div>
 <div class="grid fcs">${LESSONS.map(fc).join('')}</div>`;
 $$('.fc').forEach(f=>f.onclick=()=>f.dataset.lock?plans():f.classList.toggle('on'));

 $('#pr').onclick=()=>{$('#sheet').innerHTML=LESSONS.filter(l=>!locked(l)).map(l=>`<div class="pc"><div class="pe">${l.e}</div><h3>${l.t}</h3><small>${cat(l.c).n}</small><p>✅ ${good(l)}</p><p>❌ ${bad(l)}</p><b>${code(l)}</b></div>`).join('');window.print()}}

/* ============ AI TRÒ CHUYỆN: 2 cuộc trò chuyện riêng cho bé và phụ huynh ============ */
const catalog=()=>LESSONS.map(l=>`${l.id}=${l.t}`).join('; ');
function sysPrompt(r){const base=`Ứng dụng Little Hero dạy kỹ năng sống cho trẻ 3-10 tuổi. Danh sách bài học (id=tên): ${catalog()}. `;
 if(r==='child')return base+`Bạn là Hero, người bạn thân thiện của bé ${S.set.age} tuổi${S.user?' tên '+S.user.name:''}. Trả lời MỌI câu hỏi của bé bằng tiếng Việt đơn giản, tối đa 3 câu ngắn, vui vẻ, đúng sự thật và an toàn. Nếu nội dung không phù hợp với trẻ em hoặc nguy hiểm, từ chối nhẹ nhàng và khuyên bé hỏi bố mẹ. Nếu bé buồn, sợ hoặc bị đe dọa, hãy an ủi và khuyên bé nói ngay với người lớn tin cậy. Nếu bé muốn học hoặc chơi một chủ đề khớp với bài học, đặt "lesson" là id bài đó. Phụ huynh dặn: ${S.notes.slice(-5).join('; ')||'không có'}. Chỉ trả về JSON: {"reply":"...","lesson":"id hoặc null"}`;
 return base+`Bạn là trợ lý dành cho phụ huynh. Trả lời mọi câu hỏi (nuôi dạy con, giáo dục, đời sống...) bằng tiếng Việt rõ ràng, thực tế, không thay thế bác sĩ hay chuyên gia. Phụ huynh có thể nhờ chỉnh giọng của Hero ("settings": rate 0.5-1.3, pitch 0.6-2, age 3-12) hoặc dặn điều cần chú ý khi nói chuyện với bé ("note"). Chỉ trả về JSON: {"reply":"...","settings":null,"note":null,"lesson":null}`}
function toMsgs(list){const out=[];list.slice(-12).forEach(m=>{const role=m.who==='me'?'user':'assistant',last=out[out.length-1];if(last&&last.role===role)last.content+='\n'+m.t;else out.push({role,content:m.t})});
 while(out.length&&out[0].role!=='user')out.shift();return out}
function localAI(r,t){const s=t.toLowerCase(),st=S.set,o={reply:''};
 if(/chậm/.test(s)){st.rate=Math.max(.5,st.rate-.15);o.reply='Mình sẽ nói chậm hơn nhé.'}
 else if(/nhanh/.test(s)){st.rate=Math.min(1.3,st.rate+.15);o.reply='Mình sẽ nói nhanh hơn một chút.'}
 else if(/(\d+)\s*tuổi/.test(s)){st.age=+s.match(/(\d+)\s*tuổi/)[1];o.reply=`Mình ghi nhận bé ${st.age} tuổi rồi.`}
 else{const names={sv:'sinh tồn',bv:'tự bảo vệ|an toàn',ks:'kỹ năng sống',lp:'lễ phép',vl:'vâng lời',xl:'xin lỗi|bạn bè'};
  let l=LESSONS.find(x=>x.k.split('|').some(w=>s.includes(w)));
  if(!l){const c=Object.keys(names).find(k=>names[k].split('|').some(w=>s.includes(w)));if(c)l=LESSONS.find(x=>x.c===c&&!locked(x)&&!okd(x))||LESSONS.find(x=>x.c===c)}
  if(l){o.lesson=l.id;o.reply=`Mình cùng học bài "${l.t}" nhé!`}
  else if(r==='parent'){S.notes.push(t);o.reply='Mình đã ghi lại yêu cầu của ba mẹ. Để mình trả lời mọi câu hỏi và hiểu yêu cầu tự do, ba mẹ hãy kết nối AI ở mục Phụ huynh nhé.'}
  else o.reply='Câu hỏi hay quá! Để mình trả lời được mọi câu hỏi, ba mẹ cần kết nối AI cho mình ở mục Phụ huynh. Còn bây giờ, bạn thử nói "học về bị lạc" hoặc "học về lễ phép" nhé!'}
 return o}
async function askAI(r,list){const msgs=toMsgs(list),system=sysPrompt(r);
 try{let txt;
  if(S.api){const x=await fetch(S.api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system,messages:msgs,model:CONFIG.model})});txt=(await x.json()).text}
  else if(S.key){const x=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:CONFIG.model,max_tokens:500,system,messages:msgs})});
   const d=await x.json();if(!x.ok)throw new Error((d.error&&d.error.message)||'lỗi '+x.status);txt=d.content[0].text}
  if(txt){let o;try{o=JSON.parse(txt.match(/\{[\s\S]*\}/)[0])}catch(e){o={reply:txt}}if(typeof o.reply!=='string')o.reply=String(txt);return o}
 }catch(e){toast('Chưa kết nối được AI ('+e.message+'). Đang dùng chế độ cơ bản.')}
 return localAI(r,list[list.length-1].t)}
function chat(){const r=S.role,L=S.chats[r];
 if(!L.length)L.push({who:'ai',t:r==='child'?'Chào bạn! Mình là Hero. Bạn hỏi mình bất cứ điều gì nhé, hoặc nói "mình muốn học về bị lạc" để vào bài học ngay!':'Xin chào ba mẹ! Ba mẹ có thể hỏi mình về cách dạy bé, nhờ mình chỉnh giọng nói của Hero, hoặc dặn mình điều cần chú ý khi trò chuyện với bé.'});
 const mode=S.api||S.key?'AI đã kết nối':'Chế độ cơ bản (chưa kết nối AI)';
 app.innerHTML=`<h2>Hỏi Hero</h2><div class="panel"><div class="chead"><div class="av" id="av">${char('me','idle')}</div><div class="seg" id="seg"><button data-r="child" class="${r==='child'?'on':''}">🧒 Bé nói</button><button data-r="parent" class="${r==='parent'?'on':''}">👪 Phụ huynh nói</button></div></div>
 <p class="note">${r==='child'?'Cuộc trò chuyện của bé':'Cuộc trò chuyện riêng của phụ huynh'} · ${mode}</p>
 <div class="chat"><div class="msgs" id="msgs"></div><div class="inp"><input id="in" placeholder="${r==='child'?'Hỏi Hero điều bạn muốn biết…':'Hỏi hoặc dặn Hero…'}" aria-label="Tin nhắn"><button class="btn" id="send">Gửi</button><button class="btn sun" id="mic" aria-label="Nói">🎤</button></div>
 <p class="note"><label style="display:inline"><input type="checkbox" id="vc"> Trò chuyện bằng giọng nói liên tục</label></p></div></div>`;
 const box=$('#msgs'),draw=()=>{box.innerHTML=L.map(m=>`<div class="m ${m.who==='me'?'me':''}">${esc(m.t)}${m.go?` <button class="btn sun" data-g="${m.go}">▶ Học bài này</button>`:''}</div>`).join('');box.scrollTop=1e9;
  $$('[data-g]').forEach(b=>b.onclick=()=>play(LESSONS.find(x=>x.id===b.dataset.g)))};
 Voice.cb=f=>{const a=$('#av');if(a)a.innerHTML=char('me',f?'wave':'idle')};
 async function send(t){t=t.trim();if(!t)return;const today=new Date().toDateString();if(S.used.d!==today)S.used={d:today,n:0};
  L.push({who:'me',t});draw();
  if(S.plan==='free'&&S.used.n>=10){L.push({who:'ai',t:'Hôm nay Hero đã trò chuyện đủ 10 tin của gói miễn phí rồi. Ba mẹ nâng cấp Premium để nói chuyện không giới hạn nhé!'});draw();save();return}
  S.used.n++;L.push({who:'ai',t:'…',tmp:1});draw();const o=await askAI(r,L.filter(m=>!m.tmp));L.pop();
  if(o.settings&&typeof o.settings==='object'){const s=o.settings;if(+s.rate)S.set.rate=Math.min(1.3,Math.max(.5,+s.rate));if(+s.pitch)S.set.pitch=Math.min(2,Math.max(.6,+s.pitch));if(+s.age)S.set.age=Math.min(12,Math.max(3,+s.age))}
  if(o.note&&r==='parent')S.notes.push(String(o.note));
  const les=LESSONS.find(x=>x.id===o.lesson);let go=null,text=o.reply;
  if(les){if(locked(les))text+=' Bài này thuộc gói Premium, nhờ ba mẹ mở khóa nhé!';else go=les.id}
  L.push({who:'ai',t:text,go});if(L.length>40)L.splice(0,L.length-40);save();draw();
  Voice.speak(text,()=>{if(view!=='chat')return;if(go&&r==='child')play(les);else if(Voice.chatMode)Voice.listen(send,$('#mic'))})}
 draw();$('#send').onclick=()=>{send($('#in').value);$('#in').value=''};$('#in').onkeydown=e=>{if(e.key==='Enter')$('#send').click()};
 $('#mic').onclick=e=>Voice.listen(send,e.currentTarget);
 $('#vc').onchange=e=>{Voice.chatMode=e.target.checked;if(e.target.checked)Voice.listen(send,$('#mic'))};
 $$('#seg button').forEach(b=>b.onclick=()=>{if(b.dataset.r==='parent'&&!gated)return gate(()=>{S.role='parent';save();go('chat')});S.role=b.dataset.r;save();go('chat')})}

/* ============ PHỤ HUYNH / HỒ SƠ ============ */
function parentV(){const total=Object.values(S.prog).reduce((a,s)=>a+s.plays,0);
 app.innerHTML=`<h2>Góc phụ huynh</h2><div class="panel"><div class="row"><span>Cấp độ</span><b>Lv ${lv()} – ${title()}</b></div><div class="row"><span>Tổng điểm</span><b>${S.xp} ⭐</b></div><div class="row"><span>Tổng lượt chơi</span><b>${total}</b></div></div>
 <div class="panel"><h3>Kỹ năng theo chủ đề</h3>${CATS.map(c=>{const ls=LESSONS.filter(l=>l.c===c.id),n=ls.filter(okd).length;return `<div class="row"><span>${c.e} ${c.n}</span><div class="bar"><i style="width:${n/ls.length*100}%"></i></div><b>${n}/${ls.length}</b></div>`}).join('')}</div>
 <div class="panel"><h3>Giọng nói của Hero</h3><div class="row"><span>Tốc độ</span><input type="range" id="rt" min=".5" max="1.3" step=".05" value="${S.set.rate}"></div><div class="row"><span>Độ cao</span><input type="range" id="pt" min=".6" max="2" step=".1" value="${S.set.pitch}"></div>
 <label><input type="checkbox" id="vo" ${Voice.on?'checked':''}> Bật giọng đọc</label><p class="note">Yêu cầu đã dặn Hero: ${S.notes.length?esc(S.notes.slice(-3).join(' · ')):'chưa có'}</p></div>
 <div class="panel"><h3>Kết nối AI (để Hero trả lời mọi câu hỏi)</h3><p class="note">Trạng thái: <b>${S.api?'dùng máy chủ riêng':S.key?'dùng API key':'chưa kết nối'}</b></p>
 <label>Địa chỉ máy chủ (khuyên dùng, xem file server.js)<input type="url" id="ap" placeholder="http://localhost:3000/api/chat" value="${esc(S.api)}"></label>
 <label>Hoặc API key Anthropic (chỉ để thử trên máy của bạn)<input type="password" id="ak" placeholder="sk-ant-..." value="${esc(S.key)}"></label>
 <p class="note">⚠️ API key lưu trong trình duyệt, chỉ dùng thử. Khi đưa app lên mạng, hãy dùng máy chủ riêng để giữ key an toàn.</p><button class="btn" id="sv">Lưu kết nối</button></div>`;
 $('#rt').oninput=e=>{S.set.rate=+e.target.value;save()};$('#pt').oninput=e=>{S.set.pitch=+e.target.value;save()};$('#vo').onchange=e=>Voice.on=e.target.checked;
 $('#sv').onclick=()=>{S.api=$('#ap').value.trim();S.key=$('#ak').value.trim();save();toast('Đã lưu kết nối AI');parent()}}
function profile(){if(!S.user)return go('home');const done=LESSONS.filter(okd);
 app.innerHTML=`<h2>Hồ sơ của ${esc(S.user.name)}</h2><div class="panel end"><div style="width:150px;margin:auto">${char('me','wave')}</div><h3>${title()} · Lv ${lv()}</h3>
 <p>Bé ${S.user.age} tuổi · Gói ${S.plan==='premium'?'👑 Premium':'Miễn phí'}<br>Phụ huynh: ${esc(S.user.email)} · ${esc(S.user.phone||'')}</p>
 <div class="seg">Hero của bé: <button data-h="boy" class="${S.hero==='boy'?'on':''}">👦 Bin</button><button data-h="girl" class="${S.hero==='girl'?'on':''}">👧 Mia</button></div></div>
 <div class="panel"><h3>Huy hiệu (${done.length})</h3><p style="font-size:40px;margin:0">${done.length?done.map(l=>l.e).join(' '):'<span class="note">Chọn đúng một bài để nhận huy hiệu</span>'}</p></div><button class="btn" id="out">Đăng xuất</button>`;
 $$('.seg button').forEach(b=>b.onclick=()=>{S.hero=b.dataset.h;save();profile()});$('#out').onclick=()=>{S.user=null;save();go('home')}}

/* ============ ĐĂNG NHẬP / ĐĂNG KÝ / FREEMIUM (demo, chưa có máy chủ) ============ */
function auth(mode){const up=mode==='up',m=modal(`<h2>${up?'Tạo tài khoản cho bé':'Đăng nhập'}</h2>
 ${up?`<label>Tên của bé<input id="n"></label><label>Tuổi<select id="a">${[3,4,5,6,7,8,9,10].map(x=>`<option>${x}</option>`).join('')}</select></label>
 <label>Bé là<select id="gd"><option value="boy">Bé trai (Hero Bin)</option><option value="girl">Bé gái (Hero Mia)</option></select></label>
 <label>Số điện thoại phụ huynh<input id="ph" type="tel" inputmode="tel" placeholder="0901234567"></label>`:''}
 <label>Email phụ huynh<input id="e" type="email"></label><label>Mật khẩu<input id="p" type="password"></label>
 <p class="note">Bản demo: dữ liệu chỉ lưu trên máy này, mật khẩu chưa được xử lý. Bản thật cần máy chủ để đăng nhập an toàn.</p>
 <p id="er" style="color:var(--coral);font-weight:700"></p><button class="btn" id="ok">${up?'Đăng ký':'Đăng nhập'}</button> <button class="btn ghost" id="sw">${up?'Đã có tài khoản':'Tạo tài khoản mới'}</button>`);
 const q=s=>m.querySelector(s);q('#sw').onclick=()=>{m.remove();auth(up?'in':'up')};
 q('#ok').onclick=()=>{const e=q('#e').value.trim().toLowerCase(),er=q('#er');
  if(!/.+@.+\..+/.test(e)||q('#p').value.length<6){er.textContent='Nhập email hợp lệ và mật khẩu từ 6 ký tự.';return}
  if(up){const n=q('#n').value.trim(),ph=q('#ph').value.replace(/[\s.]/g,'');
   if(!n){er.textContent='Hãy nhập tên của bé.';return}if(!/^(0|\+84)\d{9,10}$/.test(ph)){er.textContent='Số điện thoại chưa đúng (ví dụ 0901234567).';return}
   S.users[e]={name:n,email:e,phone:ph,age:+q('#a').value,g:q('#gd').value};S.user=S.users[e];S.hero=S.user.g}
  else{if(!S.users[e]){er.textContent='Chưa có tài khoản với email này. Hãy đăng ký.';return}S.user=S.users[e];S.hero=S.user.g||S.hero}
  save();m.remove();toast('Xin chào '+S.user.name+'!');go(view==='play'?'home':view)}}
function plans(){const m=modal(`<h2>Chọn gói học</h2><div class="plans">
 <div class="plan"><h3>Miễn phí</h3><b>0đ</b><ul><li>12 bài học cơ bản</li><li>3 truyện tranh</li><li>10 tin nhắn AI mỗi ngày</li><li>Điểm và cấp độ</li></ul></div>
 <div class="plan pro"><h3>👑 Premium</h3><b>99.000đ/tháng</b><ul><li>Mở khóa 6 bài học Premium</li><li>Truyện và thẻ bài Premium</li><li>Trò chuyện AI không giới hạn</li></ul><button class="btn" id="up">${S.plan==='premium'?'Đang dùng ✓':'Phụ huynh nâng cấp'}</button></div></div>
 <p class="note">Bản demo: nút này chỉ bật thử gói, chưa thanh toán thật. Phụ huynh cần xác nhận trước khi nâng cấp.</p>`);
 m.querySelector('#up').onclick=()=>{if(S.plan==='premium')return;gate(()=>{S.plan='premium';save();m.remove();shell();toast('Đã mở khóa Premium! Bé có thể học các bài 👑');go(view==='play'?'learn':view)})}}

if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
go('home');
</script>
  <script src="../front end/data.js" defer></script>
  <script src="../front end/auth.js" defer></script>
  <script src="../front end/comics.js" defer></script>
  <script src="../front end/voice.js" defer></script>
</body>
</html>
